name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Example suite runs offline
        run: |
          s1kit test examples/support-tickets.yaml --out /tmp/results.jsonl
          s1kit calibrate /tmp/results.jsonl --target 0.95 --out /tmp/thresholds.yaml
