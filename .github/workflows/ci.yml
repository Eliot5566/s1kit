name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Quickstart works in an empty folder
        run: |
          cd "$(mktemp -d)"
          s1kit init
          s1kit test
          s1kit calibrate results.jsonl --target 0.95

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the example suite
        uses: ./
        with:
          suite: examples/support-tickets.yaml
          fail-under: "0.7"
      - name: The action fails the job below the bar
        id: strict
        continue-on-error: true
        uses: ./
        with:
          suite: examples/support-tickets.yaml
          fail-under: "0.9"
      - if: steps.strict.outcome != 'failure'
        run: echo "expected --fail-under 0.9 to fail" && exit 1
