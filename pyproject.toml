[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1kit"
dynamic = ["version"]
description = "Test, calibrate and route System One decision models (Jev, Laya, kev, llama.cpp, Ollama) on your own data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Eliot5566" }]
keywords = ["system-one", "decision-models", "jev", "laya", "calibration", "evaluation", "llm-routing"]
dependencies = ["PyYAML>=6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Eliot5566/s1kit"
Issues = "https://github.com/Eliot5566/s1kit/issues"
Changelog = "https://github.com/Eliot5566/s1kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
s1kit = "s1kit.cli:main"

[tool.hatch.version]
path = "src/s1kit/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
